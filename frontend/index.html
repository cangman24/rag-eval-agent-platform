<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领域知识问答</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#15181d; --muted:#6b7280;
    --border:#e4e7ec; --accent:#2563eb; --accent-soft:#eff4ff;
    --warn-bg:#fff8e6; --warn-border:#f2d08a; --warn-text:#8a6100;
    --ok:#16a34a; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.04);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e1116; --card:#161a21; --text:#e6e9ee; --muted:#98a2b3;
      --border:#252b36; --accent:#6ea8fe; --accent-soft:#18243a;
      --warn-bg:#2a2213; --warn-border:#5c4a1d; --warn-text:#e0b95c;
      --ok:#4ade80; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .app{display:flex;flex-direction:column;height:100%}

  header{
    display:flex;align-items:center;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--border);background:var(--card)
  }
  header h1{font-size:15px;font-weight:650;margin:0;letter-spacing:.2px}
  header .sub{font-size:12px;color:var(--muted)}
  .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;background:#c9ced6}
  .dot.ok{background:var(--ok)}
  .dot.bad{background:#ef4444}
  .dot.wait{background:#f59e0b;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}

  main{flex:1;overflow-y:auto;padding:24px 20px 8px}
  .wrap{max-width:800px;margin:0 auto}

  /* 空状态 */
  .empty{text-align:center;padding:48px 0 24px}
  .empty h2{font-size:20px;font-weight:650;margin:0 0 6px}
  .empty p{color:var(--muted);margin:0 0 26px;font-size:13.5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{
    padding:7px 13px;border:1px solid var(--border);background:var(--card);
    border-radius:999px;font-size:13px;color:var(--text);cursor:pointer;
    transition:.15s;box-shadow:var(--shadow)
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

  /* 问答块 */
  .qa{margin-bottom:26px}
  .q{display:flex;justify-content:flex-end;margin-bottom:10px}
  .q span{
    background:var(--accent);color:#fff;padding:9px 14px;border-radius:14px 14px 4px 14px;
    max-width:78%;font-size:14px;word-break:break-word
  }
  .a-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow)
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    font-size:12px;color:var(--muted);margin-bottom:10px;min-height:16px
  }
  .meta .pill{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px}
  .dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  .answer{font-size:14.5px;word-break:break-word}
  /* 生成中的光标：只靠这个让用户知道"还在长"，不用额外提示条 */
  .answer.streaming::after{
    content:"▍";display:inline-block;margin-left:1px;color:var(--accent);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .answer p{margin:0 0 10px}
  .answer p:last-child{margin-bottom:0}
  .answer ul{margin:6px 0 10px;padding-left:20px}
  .answer li{margin:3px 0}
  .answer strong{font-weight:650}
  .answer code{font-family:var(--mono);font-size:12.5px;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
  .cite{
    display:inline-block;min-width:15px;text-align:center;
    font-size:11px;font-family:var(--mono);line-height:15px;
    background:var(--accent-soft);color:var(--accent);
    border-radius:4px;padding:0 3px;margin:0 1px;cursor:pointer;
    vertical-align:baseline;transition:.15s
  }
  .cite:hover{background:var(--accent);color:#fff}

  /* 拒答 */
  .refused .a-card{background:var(--warn-bg);border-color:var(--warn-border)}
  .refused .answer{color:var(--warn-text)}
  .badge-refuse{background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border)}

  /* 引用 */
  .cites{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px}
  .cites-title{font-size:12px;color:var(--muted);margin-bottom:8px}
  .cite-item{
    border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin-bottom:7px;
    cursor:pointer;transition:.15s;background:var(--bg)
  }
  .cite-item:hover{border-color:var(--accent)}
  .cite-item.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .cite-head{display:flex;gap:8px;align-items:baseline}
  .cite-n{
    font-family:var(--mono);font-size:11px;color:var(--accent);
    background:var(--accent-soft);border-radius:4px;padding:1px 5px;flex:none
  }
  .cite-id{font-family:var(--mono);font-size:12px;color:var(--text);word-break:break-all}
  .cite-snip{
    font-size:12.5px;color:var(--muted);margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .cite-item.open .cite-snip{-webkit-line-clamp:unset;display:block}

  .err{
    background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-text);
    padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:20px
  }
  .err code{font-family:var(--mono);font-size:12px}

  /* 输入区 */
  footer{padding:12px 20px 20px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
  .composer{max-width:800px;margin:0 auto}
  .box{
    display:flex;gap:10px;align-items:flex-end;background:var(--card);
    border:1px solid var(--border);border-radius:14px;padding:10px 10px 10px 14px;
    box-shadow:var(--shadow);transition:.15s
  }
  .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{
    flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);
    font:inherit;font-size:14.5px;line-height:1.6;max-height:160px;padding:2px 0
  }
  textarea::placeholder{color:var(--muted)}
  button.send{
    border:0;background:var(--accent);color:#fff;border-radius:9px;
    padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;flex:none;transition:.15s
  }
  button.send:disabled{opacity:.5;cursor:not-allowed}
  button.send:not(:disabled):hover{filter:brightness(1.06)}
  .opts{
    display:flex;gap:16px;align-items:center;margin-top:9px;
    font-size:12px;color:var(--muted);padding-left:4px
  }
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
  .opts input{accent-color:var(--accent);margin:0}
  .hint{margin-left:auto;font-family:var(--mono);font-size:11px}

  /* ---- 视图切换 ---- */
  .tabs{display:flex;gap:4px;margin-left:14px}
  .tab{
    border:1px solid var(--border);background:transparent;color:var(--muted);
    padding:4px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;transition:.15s
  }
  .tab.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

  /* ---- 轨迹面板 ---- */
  .th-head{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px
  }
  .th-head h2{font-size:16px;font-weight:650;margin:0}
  .th-sub{font-size:12px;color:var(--muted)}
  .th-actions{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
  .th-actions select{
    background:var(--card);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:4px 8px;font-size:12px;max-width:260px
  }
  .th-actions label{display:flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
  .th-actions input{accent-color:var(--accent);margin:0}

  .sum-bar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px 13px;margin-bottom:14px;font-size:12px;box-shadow:var(--shadow)
  }
  .sum-bar .pill{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:11.5px}
  .sum-bar .pill.bad{background:#fee2e2;color:#b91c1c}
  .sum-bar .tid{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:auto}

  .timeline{display:flex;flex-direction:column;gap:6px}
  .tl-item{
    border:1px solid var(--border);border-left:3px solid var(--border);
    border-radius:9px;background:var(--card);padding:8px 11px;cursor:pointer;transition:.15s
  }
  .tl-item:hover{border-color:var(--accent)}
  .tl-row{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .tl-i{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none}
  .tl-type{
    font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:5px;
    background:var(--accent-soft);color:var(--accent);flex:none
  }
  .tl-desc{font-size:13px;flex:1;min-width:120px;word-break:break-word}
  .tl-t{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
  .tl-json{
    display:none;margin:8px 0 2px;padding:9px 11px;border-radius:7px;
    background:var(--bg);border:1px solid var(--border);
    font-family:var(--mono);font-size:11.5px;line-height:1.55;
    white-space:pre-wrap;word-break:break-all;color:var(--text);max-height:320px;overflow:auto
  }
  .tl-item.open .tl-json{display:block}
  .tl-item.t-blue{border-left-color:var(--accent)}
  .tl-item.t-green{border-left-color:var(--ok)}
  .tl-item.t-green .tl-type{background:#e7f6ec;color:#15803d}
  .tl-item.t-amber{border-left-color:#d99a1c}
  .tl-item.t-amber .tl-type{background:var(--warn-bg);color:var(--warn-text)}
  .tl-item.t-red{border-left-color:#ef4444;background:var(--warn-bg)}
  .tl-item.t-red .tl-type{background:#fee2e2;color:#b91c1c}
  .tl-item.t-gray{border-left-color:#9ca3af}
  .tl-item.t-gray .tl-type{background:var(--bg);color:var(--muted)}
  .timeline.only-err .tl-item:not(.t-red){display:none}
  .tl-empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}

  /* ---- 耗时归因（span 甘特条）---- */
  .gantt{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:11px 13px;margin-bottom:14px;box-shadow:var(--shadow)
  }
  .gt-head{
    display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;
    font-size:12.5px;margin-bottom:10px
  }
  .gt-head b{font-weight:650}
  .gt-total{font-family:var(--mono);color:var(--accent);font-size:12px}
  .gt-mut{color:var(--muted);font-size:11.5px}
  .gt-row{display:flex;align-items:center;gap:9px;height:19px;font-size:11.5px}
  .gt-name{
    font-family:var(--mono);width:170px;flex:none;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;color:var(--text)
  }
  .gt-track{
    position:relative;flex:1;min-width:80px;height:9px;
    background:var(--bg);border-radius:5px;overflow:hidden
  }
  .gt-bar{
    position:absolute;top:0;height:9px;border-radius:5px;
    background:var(--accent);opacity:.85;min-width:2px
  }
  .gt-ms{
    font-family:var(--mono);color:var(--muted);width:74px;
    text-align:right;flex:none;font-size:11px
  }
  .gt-row.k-tool .gt-bar{background:#8b5cf6;opacity:.8}
  .gt-row.bad .gt-bar{background:#ef4444;opacity:1}
  .gt-row.bad .gt-name{color:#b91c1c}
  .gt-err{
    margin-top:9px;padding-top:8px;border-top:1px dashed var(--border);
    font-family:var(--mono);font-size:11.5px;color:#b91c1c;line-height:1.6
  }
  .gt-err .lbl{color:var(--muted);font-family:inherit}

  /* ---------------- 会话 / 历史抽屉 ---------------- */
  .hdr-actions{display:flex;gap:8px;align-items:center}
  .ghost{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:5px 11px;border-radius:8px;font-size:12.5px;cursor:pointer;
    font-family:inherit;transition:all .15s;white-space:nowrap;
  }
  .ghost:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.36);z-index:40;display:none}
  .mask.on{display:block}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:330px;max-width:88vw;
    background:var(--card);border-right:1px solid var(--border);z-index:41;
    transform:translateX(-102%);transition:transform .22s ease;
    display:flex;flex-direction:column;box-shadow:var(--shadow);
  }
  .drawer.on{transform:none}
  .drawer-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
  .drawer-h h3{margin:0;font-size:14px;font-weight:600}
  .drawer-h .ghost{margin-left:auto}
  .drawer-list{overflow:auto;padding:8px;flex:1}
  /* 一行 = 打开按钮 + 删除按钮。不用 <button> 套 <button>（HTML 非法），
     所以外层是 div，里面两个平级 button。 */
  .sess{
    display:flex;align-items:stretch;gap:2px;margin-bottom:2px;
    border:1px solid transparent;border-radius:10px;
  }
  .sess:hover{background:var(--accent-soft)}
  .sess.on{border-color:var(--accent);background:var(--accent-soft)}
  .sess-open{
    flex:1;min-width:0;display:block;text-align:left;background:transparent;
    border:0;border-radius:10px;padding:9px 10px;
    cursor:pointer;font-family:inherit;color:var(--text);
  }
  .sess-del{
    flex:0 0 auto;width:34px;background:transparent;border:0;border-radius:10px;
    color:var(--muted);cursor:pointer;font-size:15px;line-height:1;
    opacity:0;transition:opacity .15s, background .15s, color .15s;
  }
  .sess:hover .sess-del{opacity:1}
  .sess-del:hover{color:#dc2626;background:rgba(220,38,38,.12)}
  /* 二次确认态：变红并把文案换成"删除?"，3 秒后自动复位 */
  .sess-del.arm{
    opacity:1;width:auto;padding:0 9px;font-size:11px;font-family:var(--mono);
    color:#dc2626;background:rgba(220,38,38,.14);
  }
  .sess-del:disabled{opacity:.5;cursor:default}
  /* 触屏没有 hover，删除键必须常驻，否则永远点不到 */
  @media (hover:none){ .sess-del{opacity:.7} }
  .sess-t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess-p{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .sess-d{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:var(--mono);opacity:.8}
  .drawer-f{padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);font-family:var(--mono)}
  .sess-empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>领域知识问答</h1>
      <div class="sub" id="sub">82 篇作业规范 · 302 个片段 · 答案带出处</div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabChat">问答</button>
      <button class="tab" id="tabTrace">Agent 轨迹</button>
    </div>
    <div class="hdr-actions">
      <button class="ghost" id="newChatBtn" title="新建一条会话（旧会话仍存在本地库里）">＋ 新对话</button>
      <button class="ghost" id="histBtn" title="历史会话（SQLite 持久化）">历史</button>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">检测中…</span></div>
  </header>

  <main id="main">
    <div class="wrap" id="wrap">
      <div class="empty" id="empty">
        <h2>问点什么吧</h2>
        <p>答案只来自知识库，每条结论都带 [n] 出处，可点开看原文片段</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>

    <div class="wrap" id="traceWrap" style="display:none">
      <div class="th-head">
        <div>
          <h2>Agent 推理轨迹</h2>
          <div class="th-sub">节点粒度实时推送 · 错误 / 熔断节点标红，点开看原始 payload</div>
        </div>
        <div class="th-actions">
          <select id="threadSel"><option value="">回放历史 thread…</option></select>
          <label><input type="checkbox" id="onlyErr"> 只看错误</label>
        </div>
      </div>
      <div class="gantt" id="gantt" style="display:none"></div>
      <div class="sum-bar" id="traceSum" style="display:none"></div>
      <div class="timeline" id="timeline"></div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send" id="send">发送</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="retrieveOnly"> 只看检索（不生成，省钱秒回）</label>
        <span class="hint" id="hint">SSE token 级流式</span>
      </div>
    </div>
  </footer>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <h3>历史会话</h3>
    <button class="ghost" id="closeDrawer">关闭</button>
  </div>
  <div class="drawer-list" id="sessList"></div>
  <div class="drawer-f" id="sessFoot">SQLite · data/app.db</div>
</aside>

<script>
(function(){
  "use strict";
  var API = "/api";
  var main = document.getElementById("main");
  var wrap = document.getElementById("wrap");
  var empty = document.getElementById("empty");
  var ta = document.getElementById("q");
  var sendBtn = document.getElementById("send");
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var retrieveOnly = document.getElementById("retrieveOnly");
  var hint = document.getElementById("hint");
  var ctrl = null;

  var SAMPLES = [
    "倒伏面积评估的精度要求是什么？",
    "高光谱成像仪的作业参数要求",
    "病虫害巡检的作业流程是什么？分几步？",
    "公司年假的请假流程怎么走？"
  ];

  /* ---------------- 工具函数 ---------------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  // 轻量 markdown：段落 / 无序列表 / 加粗 / 行内代码 / [n] 角标
  function render(text){
    var safe = esc(text);
    var blocks = safe.split(/\n{2,}/);
    var out = [];
    blocks.forEach(function(block){
      var lines = block.split("\n");
      var isList = lines.length && lines.every(function(l){ return /^\s*[-*]\s+/.test(l) || l.trim()===""; });
      if (isList){
        var items = lines.filter(function(l){ return l.trim()!==""; })
          .map(function(l){ return "<li>" + inline(l.replace(/^\s*[-*]\s+/,"")) + "</li>"; });
        if (items.length) out.push("<ul>" + items.join("") + "</ul>");
      } else {
        var ps = block.split("\n").filter(function(l){ return l.trim()!==""; });
        if (ps.length) out.push("<p>" + ps.map(inline).join("<br>") + "</p>");
      }
    });
    return out.join("");
  }
  function inline(s){
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[(\d{1,2})\]/g, '<span class="cite" data-i="$1">$1</span>');
  }
  function scrollBottom(){
    main.scrollTop = main.scrollHeight;
  }
  function setStatus(kind, text){
    dot.className = "dot " + kind;
    statusText.textContent = text;
  }

  /* ---------------- 健康检查 ---------------- */
  function health(){
    fetch(API + "/health", {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        setStatus("ok", "就绪 · " + (d.index_size || 0) + " 片段");
        var bits = [];
        if (d.index_size) bits.push(d.index_size + " 个片段");
        if (d.llm_configured) bits.push("LLM 已接");
        document.getElementById("sub").textContent =
          "82 篇作业规范 · " + bits.join(" · ") + " · 答案带出处";
      })
      .catch(function(){
        setStatus("bad", "后端未连接");
        var e = document.createElement("div");
        e.className = "err";
        e.innerHTML = "连不上后端（<code>" + esc(API) + "/health</code>）。<br>" +
          "先在 <code>_starter</code> 里启动服务：<br>" +
          "<code>python -m rag1_knowledge_qa.server</code>（需 conda agent_rag 环境）";
        wrap.appendChild(e);
      });
  }

  /* ---------------- 示例问题 ---------------- */
  function buildChips(el){
    el.innerHTML = "";
    SAMPLES.forEach(function(s){
      var b = document.createElement("button");
      b.className = "chip";
      b.textContent = s;
      b.onclick = function(){ ask(s); };
      el.appendChild(b);
    });
  }
  buildChips(document.getElementById("chips"));

  /* ================= 会话：SQLite 持久化 =================
     为什么前端只存一个 id、不存消息体：
       消息（含引用 snippet）可能有几十 KB，localStorage 有 5MB 上限，
       多轮之后必然写爆；而消息本来就该在服务端。这里 localStorage 只做
       "记住你上次在哪条会话"，真正的数据在 data/app.db。
  */
  var SID = null;
  var DESTRUCTIVE_HINT = "删除这条会话（不可恢复）";
  var sessList = document.getElementById("sessList");
  var mask = document.getElementById("mask");
  var drawer = document.getElementById("drawer");

  function lsGet(){ try{ return localStorage.getItem("kb_session"); }catch(_){ return null; } }
  function lsSet(v){
    try{ if (v){ localStorage.setItem("kb_session", v); } else { localStorage.removeItem("kb_session"); } }catch(_){}
  }
  function clearEmpty(){
    var e = document.getElementById("empty");
    if (e && e.parentNode) e.parentNode.removeChild(e);
  }
  function resetChat(){
    wrap.innerHTML =
      '<div class="empty" id="empty">' +
        '<h2>问点什么吧</h2>' +
        '<p>答案只来自知识库，每条结论都带 [n] 出处，可点开看原文片段</p>' +
        '<div class="chips" id="chips"></div>' +
      '</div>';
    buildChips(document.getElementById("chips"));
    main.scrollTop = 0;
  }

  function newSession(silent){
    return fetch(API + "/sessions", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(d){
      SID = d.session_id;
      lsSet(SID);
      if (!silent) resetChat();
      return SID;
    });
  }

  /* ---------------- 计数口径（这里原来是个真 bug） ----------------
     旧代码把同一批引用数了两遍：「citations.length 条引用」和
     「d.citations.length 个出处」永远是同一个数，看起来像"记录不符"。
     现在分开算：
       出处 = 不同的 chunk 数（去重后，前端能点开的卡片数）
       引用 = 答案正文里 [n] 角标出现的次数（可能一篇出处被引两次）
  */
  function countMarks(text){
    var m = String(text || "").match(/\[(\d{1,2})\]/g);
    return m ? m.length : 0;
  }
  function uniqChunks(citations){
    var seen = {}, out = [];
    (citations || []).forEach(function(c){
      var key = c.chunk_id || ("#" + c.index);
      if (seen[key]) return;
      seen[key] = 1;
      out.push(c);
    });
    return out;
  }
  function fmtMeta(citations, answerText, latencyMs){
    var cs = uniqChunks(citations);
    var html = "";
    if (cs.length){
      html += '<span class="pill">' + cs.length + " 个出处</span>";
      var marks = countMarks(answerText) || cs.length;
      html += '<span class="pill">' + marks + " 处引用</span>";
    }
    if (latencyMs != null && !isNaN(latencyMs)){
      html += '<span class="pill">' + Math.round(latencyMs) + " ms</span>";
    }
    return html;
  }

  /* ---------------- 卡片骨架（流式与历史共用） ---------------- */
  function makeCard(query){
    var qa = document.createElement("div");
    qa.className = "qa";
    qa.innerHTML =
      '<div class="q"><span>' + esc(query) + '</span></div>' +
      '<div class="a-card">' +
        '<div class="meta"><span class="dots">检索中</span></div>' +
        '<div class="answer"></div>' +
        '<div class="cites" style="display:none"></div>' +
      '</div>';
    wrap.appendChild(qa);
    return {
      qa: qa,
      meta: qa.querySelector(".meta"),
      ansEl: qa.querySelector(".answer"),
      citesEl: qa.querySelector(".cites"),
      card: qa.querySelector(".a-card")
    };
  }

  function paintCites(citesEl, citations){
    var cs = uniqChunks(citations);
    if (!cs.length){ citesEl.style.display = "none"; citesEl.innerHTML = ""; return; }
    citesEl.style.display = "";
    citesEl.innerHTML = '<div class="cites-title">出处（点击展开原文片段）</div>' +
      cs.map(function(c, i){
        // 流式事件里叫 index，库里的列叫 idx —— 两条来源都要能对上角标
        var n = c.index || c.idx || (i + 1);
        return '<div class="cite-item" data-i="' + n + '">' +
          '<div class="cite-head">' +
            '<span class="cite-n">' + n + "</span>" +
            '<span class="cite-id">' + esc(c.chunk_id || "") + "</span></div>" +
          '<div class="cite-snip">' + esc(c.snippet || "") + "</div></div>";
      }).join("");
    bindCites(citesEl);
  }

  function bindMarks(refs){
    refs.ansEl.querySelectorAll(".cite").forEach(function(el){
      el.onclick = function(){
        var target = refs.qa.querySelector('.cite-item[data-i="' + el.dataset.i + '"]');
        if (!target) return;
        target.classList.add("open", "active");
        target.scrollIntoView({behavior:"smooth", block:"center"});
        setTimeout(function(){ target.classList.remove("active"); }, 1600);
      };
    });
  }

  /* ---------------- 历史回放：把库里的消息渲染回来 ---------------- */
  function paintSaved(refs, msg){
    var text = msg.content || "";
    if (msg.refused){
      refs.qa.classList.add("refused");
      refs.ansEl.innerHTML = render(text || "知识库中未找到相关内容。");
      refs.meta.innerHTML = '<span class="pill badge-refuse">已拒答</span>' +
        '<span class="muted">知识库中没有可支撑该问题的内容</span>';
      return;
    }
    refs.ansEl.innerHTML = render(text);
    refs.meta.innerHTML = fmtMeta(msg.citations, text, msg.latency_ms);
    paintCites(refs.citesEl, msg.citations);
    bindMarks(refs);
  }

  function renderHistory(msgs){
    if (!msgs || !msgs.length) return;
    clearEmpty();
    var q = "";
    msgs.forEach(function(m){
      if (m.role === "user"){ q = m.content || ""; return; }
      var refs = makeCard(q);
      paintSaved(refs, m);
      q = "";
    });
    scrollBottom();
  }

  /* ---------------- 历史抽屉 ---------------- */
  function openDrawer(){
    mask.classList.add("on");
    drawer.classList.add("on");
    loadSessions();
  }
  function closeDrawer(){
    mask.classList.remove("on");
    drawer.classList.remove("on");
  }
  mask.onclick = closeDrawer;
  document.getElementById("closeDrawer").onclick = closeDrawer;

  function loadSessions(){
    sessList.innerHTML = '<div class="sess-empty">读取中…</div>';
    fetch(API + "/sessions?limit=60", {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var items = d.sessions || [];
        if (!items.length){
          sessList.innerHTML = '<div class="sess-empty">还没有历史会话<br>' +
            '问一句就会自动建一条</div>';
          return;
        }
        sessList.innerHTML = "";
        items.forEach(function(s){
          var row = document.createElement("div");
          row.className = "sess" + (s.id === SID ? " on" : "");
          row.dataset.id = s.id;

          var open = document.createElement("button");
          open.className = "sess-open";
          var title = s.title || "（未命名会话）";
          var when = new Date((s.updated_at || 0) * 1000);
          open.innerHTML = '<div class="sess-t">' + esc(title) + "</div>" +
            '<div class="sess-p">' + esc(s.preview || "（空会话）") + "</div>" +
            '<div class="sess-d">' + s.message_count + " 条消息 · " +
              when.toLocaleString("zh-CN", {month:"2-digit", day:"2-digit",
                hour:"2-digit", minute:"2-digit"}) + "</div>";
          open.onclick = function(){ openSession(s.id); };

          var del = document.createElement("button");
          del.className = "sess-del";
          del.title = DESTRUCTIVE_HINT;
          del.textContent = "×";

          row.appendChild(open);
          row.appendChild(del);
          sessList.appendChild(row);
        });
      })
      .catch(function(e){
        sessList.innerHTML = '<div class="sess-empty">读取失败：' + esc(e.message) + "</div>";
      });
  }

  function openSession(id){
    return fetch(API + "/sessions/" + encodeURIComponent(id), {cache:"no-store"})
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(d){
        SID = d.id;
        lsSet(SID);
        resetChat();
        renderHistory(d.messages || []);
        closeDrawer();
      });
  }

  /* ---------------- 删除会话 ----------------
     两段式确认，不用原生 confirm（会阻塞、样式不可控、自动化测不了）：
       第一下 → 按钮变红显示「删除?」，3 秒后自动复位
       第二下 → 真删
     列表用事件委托，重建后不用重绑。
  */
  sessList.addEventListener("click", function(ev){
    var del = ev.target && ev.target.closest ? ev.target.closest(".sess-del") : null;
    if (!del) return;
    ev.stopPropagation();
    var row = del.parentNode;
    var id = row && row.dataset ? row.dataset.id : null;
    if (!id) return;

    if (!del.classList.contains("arm")){
      del.classList.add("arm");
      del.textContent = "删除?";
      clearTimeout(del._armTimer);
      del._armTimer = setTimeout(function(){
        del.classList.remove("arm");
        del.textContent = "×";
      }, 3000);
      return;
    }
    clearTimeout(del._armTimer);
    del.disabled = true;
    del.textContent = "…";
    deleteSession(id, row);
  });

  function deleteSession(id, row){
    var wasCurrent = (id === SID);
    return fetch(API + "/sessions/" + encodeURIComponent(id), {method: "DELETE"})
      .then(function(r){
        // 404 当成"已经没了"处理：可能是另一个标签页删过，重复点不该报错
        if (!r.ok && r.status !== 404) throw new Error("HTTP " + r.status);
        if (row && row.parentNode) row.parentNode.removeChild(row);
        if (wasCurrent){
          SID = null;
          lsSet(null);
          resetChat();   // 清掉当前对话区，下次提问会自动建新会话
        }
        if (!sessList.querySelector(".sess")){
          sessList.innerHTML = '<div class="sess-empty">还没有历史会话<br>' +
            '问一句就会自动建一条</div>';
        }
      })
      .catch(function(e){
        if (row){
          var del = row.querySelector(".sess-del");
          if (del){ del.disabled = false; del.classList.remove("arm"); del.textContent = "×"; }
        }
        setStatus("bad", "删除失败：" + e.message);
      });
  }

  document.getElementById("newChatBtn").onclick = function(){
    newSession(false).catch(function(e){ setStatus("bad", "新建会话失败"); });
  };
  document.getElementById("histBtn").onclick = openDrawer;

  /* 启动：优先恢复上次那条会话（这就是"刷新不丢"） */
  function boot(){
    var sid = lsGet();
    // 没有历史 id 就什么都不做 —— 等用户第一次提问，由后端 ensure 出一条会话。
    // 否则每刷新一次页面都会留下一条空会话，历史列表很快就脏了。
    if (!sid) return Promise.resolve();
    return fetch(API + "/sessions/" + encodeURIComponent(sid), {cache:"no-store"})
      .then(function(r){
        if (r.status === 404) throw new Error("gone");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(d){
        SID = d.id || sid;
        lsSet(SID);
        renderHistory(d.messages || []);
      })
      .catch(function(){
        SID = null;
        lsSet(null);
      });
  }

  /* ---------------- 提问 ---------------- */
  function ask(query){
    query = (query || "").trim();
    if (!query) return;
    clearEmpty();

    var refs = makeCard(query);
    var qa = refs.qa, meta = refs.meta, ansEl = refs.ansEl,
        citesEl = refs.citesEl, card = refs.card;
    scrollBottom();

    var t0 = performance.now();
    var citations = [];
    var answerText = "";
    var refused = false;
    var gotRetrieval = false;
    // token 级流式：tokenText 是"已到达的增量拼接"，answerText 只在
    // 最终 answer 事件里出现（全文）。两者分开，避免半途覆盖丢字。
    var tokenText = "";
    var streamPaintQueued = false;
    var gotToken = false;

    ta.value = "";
    ta.style.height = "auto";
    sendBtn.disabled = true;
    if (ctrl) ctrl.abort();
    ctrl = new AbortController();

    if (retrieveOnly.checked){
      hint.textContent = "调试模式：只检索";
      fetch(API + "/debug/retrieve?q=" + encodeURIComponent(query) + "&top_k=5")
        .then(function(r){ return r.json(); })
        .then(function(d){
          var ms = Math.round(performance.now() - t0);
          meta.innerHTML = '<span class="pill">' + d.count + " 条命中</span>" +
            '<span class="pill">' + ms + " ms</span><span>只检索，未调用模型</span>";
          var html = (d.hits || []).map(function(h, i){
            return '<div class="cite-item"><div class="cite-head">' +
              '<span class="cite-n">' + (i+1) + "</span>" +
              '<span class="cite-id">' + esc(h.chunk_id) + "</span></div>" +
              '<div class="cite-snip">' + esc(h.text || "") + "</div></div>";
          }).join("");
          citesEl.style.display = "";
          citesEl.innerHTML = '<div class="cites-title">检索命中（按精排分数降序）</div>' + html;
          bindCites(citesEl);
          scrollBottom();
        })
        .catch(function(e){ fail(meta, ansEl, e); })
        .finally(function(){ sendBtn.disabled = false; hint.textContent = "SSE token 级流式"; });
      return;
    }

    fetch(API + "/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: query, session_id: SID}),
      signal: ctrl.signal
    }).then(function(res){
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = "";
      function pump(){
        return reader.read().then(function(r){
          if (r.done) return finish();
          buf += dec.decode(r.value, {stream:true});
          var i;
          while ((i = buf.indexOf("\n\n")) >= 0){
            var frame = buf.slice(0, i);
            buf = buf.slice(i + 2);
            handleFrame(frame);
          }
          return pump();
        });
      }
      return pump();
    }).catch(function(e){
      if (e && e.name === "AbortError") return;
      fail(meta, ansEl, e);
      sendBtn.disabled = false;
    });

    function handleFrame(frame){
      var ev = "message", dataLines = [];
      frame.split("\n").forEach(function(line){
        if (!line || line.charAt(0) === ":") return;
        var idx = line.indexOf(":");
        var field = idx < 0 ? line : line.slice(0, idx);
        var val = idx < 0 ? "" : line.slice(idx + 1);
        if (val.charAt(0) === " ") val = val.slice(1);
        if (field === "event") ev = val;
        else if (field === "data") dataLines.push(val);
      });
      if (!dataLines.length) return;
      var d;
      try { d = JSON.parse(dataLines.join("\n")); } catch(_) { return; }

      if (ev === "session"){
        // 服务端下发的会话 id —— 第一次提问时才知道，务必存下来
        if (d.session_id){ SID = d.session_id; lsSet(SID); }
      } else if (ev === "start"){
        meta.innerHTML = '<span class="dots">检索中</span>';
      } else if (ev === "retrieval"){
        gotRetrieval = true;
        meta.innerHTML = '<span class="pill">命中 ' + (d.count|0) + " 条</span>" +
          '<span class="pill">top ' + Number(d.top_score || 0).toFixed(2) + "</span>" +
          '<span class="dots">生成中</span>';
        scrollBottom();
      } else if (ev === "citation"){
        citations.push(d);
        // 流式时 citation 会早于答案到达 —— 立刻把出处画出来，
        // 用户先看到"依据是哪几段"，再看着答案一个字一个字长出来
        paintCites(citesEl, citations);
        if (!gotToken) scrollBottom();
      } else if (ev === "token"){
        gotToken = true;
        tokenText += (d.text || "");
        if (ansEl.classList) ansEl.classList.add("streaming");
        meta.innerHTML = '<span class="pill">生成中</span>';
        // 每个 token 重建一次 innerHTML 会掉帧：用 rAF 合并到一帧只渲染一次
        if (!streamPaintQueued){
          streamPaintQueued = true;
          requestAnimationFrame(function(){
            streamPaintQueued = false;
            ansEl.innerHTML = render(tokenText);
            scrollBottom();
          });
        }
      } else if (ev === "answer"){
        answerText = d.text || "";
        if (ansEl.classList) ansEl.classList.remove("streaming");
        ansEl.innerHTML = render(answerText);
        meta.innerHTML = fmtMeta(citations, answerText, null);
        paintCites(citesEl, citations);
        bindMarks(refs);
        scrollBottom();
      } else if (ev === "refusal"){
        refused = true;
        if (ansEl.classList) ansEl.classList.remove("streaming");
        qa.classList.add("refused");
        ansEl.innerHTML = render(d.text || "知识库中未找到相关内容。");
        meta.innerHTML = '<span class="pill badge-refuse">已拒答</span><span>知识库中没有可支撑该问题的内容</span>';
        scrollBottom();
      } else if (ev === "error"){
        fail(meta, ansEl, new Error(d.error || "服务端错误"));
      } else if (ev === "done"){
        if (ansEl.classList) ansEl.classList.remove("streaming");
        // 首字可见延迟：从"发起提问"到第一个字出现（含检索）。
        // 另一个 first_token_ms 只从"调 LLM"算起，对外说性能时不能拿它冒充。
        if (d.first_visible_ms){
          var ft = document.createElement("span");
          ft.className = "pill";
          ft.title = "首字可见延迟：从提问到第一个字出现（含检索耗时）"
            + (d.first_token_ms ? "；其中模型首 token "
                + Math.round(d.first_token_ms) + " ms" : "");
          ft.textContent = "首字 " + Math.round(d.first_visible_ms) + " ms";
          meta.appendChild(ft);
        }
        if (d.latency_ms){
          var p = document.createElement("span");
          p.className = "muted";
          p.textContent = "服务端 " + d.latency_ms + " ms";
          meta.appendChild(p);
        }
        // 会话标题/预览刚变了，若抽屉开着就顺手刷新
        if (drawer.classList.contains("on")) loadSessions();
      }
    }

    function finish(){
      sendBtn.disabled = false;
      if (!answerText && !refused && !citations.length){
        meta.innerHTML = '<span class="pill badge-refuse">无响应</span><span>流已结束但没收到内容</span>';
      }
    }
  }

  function bindCites(root){
    root.querySelectorAll(".cite-item").forEach(function(it){
      it.onclick = function(){ it.classList.toggle("open"); };
    });
  }
  function fail(meta, ansEl, e){
    meta.innerHTML = '<span class="pill badge-refuse">请求失败</span>';
    ansEl.innerHTML = '<p style="color:var(--muted)">' + esc(e && e.message ? e.message : String(e)) + "</p>";
  }

  /* ---------------- Agent 轨迹 ---------------- */
  var AGENT = "/agent";
  var timeline = document.getElementById("timeline");
  var traceSum = document.getElementById("traceSum");
  var ganttEl = document.getElementById("gantt");
  var threadSel = document.getElementById("threadSel");
  var onlyErr = document.getElementById("onlyErr");
  var mode = "chat";
  var agentCtrl = null;

  // ★ 事件类型 -> 颜色。红色档是"定位错误节点"的入口：
  //   tool_error（工具越权/异常）、limit（熔断）、error（图执行失败）
  var TYPE_CLASS = {
    start:"t-gray", intent:"t-blue", plan:"t-blue", resume:"t-blue",
    tool_call:"t-blue", tool_result:"t-green", answer:"t-green",
    verify:"t-amber", refusal:"t-amber",
    tool_error:"t-red", limit:"t-red", error:"t-red", done:"t-gray"
  };

  function describe(ev){
    var t = ev.type, d = ev.data || {};
    function args(a){
      return Object.keys(a || {}).map(function(k){
        var v = a[k];
        return k + "=" + (typeof v === "string" ? v : JSON.stringify(v));
      }).join(", ");
    }
    if (t === "start") return (d.query || "") + " · engine=" + (d.engine || "");
    if (t === "intent") return "意图=" + (d.task_type || "") +
      " · 白名单=[" + (d.allowed_tools || []).join(", ") + "]";
    if (t === "plan") return (d.steps || []).join(" → ");
    if (t === "tool_call") return (d.tool || "") + "(" + args(d.args) + ")";
    if (t === "tool_result") return (d.tool || "") +
      " · " + (d.ok === false ? "失败" : "成功");
    if (t === "tool_error") return (d.tool || "") +
      (d.blocked ? " · 被白名单拦截：" : " · 执行异常：") +
      (d.message || d.error || "");
    if (t === "verify") return "ok=" + !!d.ok + " · " + (d.reason || "");
    if (t === "answer") return (d.text || "").slice(0, 80);
    if (t === "limit") return "熔断：" + (d.reason || "") +
      (d.rounds != null ? " · rounds=" + d.rounds : "");
    if (t === "resume") return "从检查点续跑 · rounds=" + (d.rounds || 0);
    if (t === "done") return "结束：" + (d.reason || "") +
      " · rounds=" + (d.rounds || 0) + " · tool_calls=" + (d.tool_calls || 0);
    if (t === "summary") return "汇总";
    return JSON.stringify(d).slice(0, 100);
  }

  function renderTimeline(events){
    if (!events || !events.length){
      timeline.innerHTML = '<div class="tl-empty">还没有轨迹。在下方输入一个任务试试，' +
        '或从右上角选择历史 thread 回放。</div>';
      return;
    }
    var t0 = events[0].ts || 0;
    timeline.innerHTML = "";
    events.forEach(function(ev, i){
      var el = document.createElement("div");
      el.className = "tl-item " + (TYPE_CLASS[ev.type] || "t-gray");
      el.innerHTML =
        '<div class="tl-row">' +
          '<span class="tl-i">' + (i + 1) + '</span>' +
          '<span class="tl-type">' + esc(ev.type) + '</span>' +
          '<span class="tl-desc">' + esc(describe(ev)) + '</span>' +
          '<span class="tl-t">+' + Math.round(((ev.ts || 0) - t0) * 1000) + 'ms</span>' +
        '</div>' +
        '<pre class="tl-json">' + esc(JSON.stringify(ev.data || {}, null, 2)) + '</pre>';
      el.onclick = function(){ el.classList.toggle("open"); };
      timeline.appendChild(el);
    });
    scrollBottom();
  }

  function renderSum(sum){
    if (!sum){ traceSum.style.display = "none"; return; }
    traceSum.style.display = "";
    var ms = sum.duration_ms != null ? sum.duration_ms
           : (sum.latency_ms != null ? sum.latency_ms : 0);
    var html = '<span class="pill">事件 ' + (sum.event_count || 0) + '</span>' +
      '<span class="pill">轮次 ' + (sum.rounds || 0) + '</span>' +
      '<span class="pill">工具调用 ' + (sum.tool_calls || 0) + '</span>' +
      '<span class="pill">' + ms + ' ms</span>';
    html += sum.error_count
      ? '<span class="pill bad">错误节点 ' + sum.error_count + "（" +
        (sum.error_types || []).join(" / ") + "）</span>"
      : '<span class="pill">无错误节点</span>';
    if (sum.stop_reason) html += '<span class="pill">stop=' + esc(sum.stop_reason) + '</span>';
    html += '<span class="tid">' + esc(sum.thread_id || "") + '</span>';
    traceSum.innerHTML = html;
  }

  /* ---------------- 耗时归因（span 甘特条）---------------- */
  function fmtMs(v){
    v = Number(v || 0);
    if (v >= 1000) return (Math.round(v / 100) / 10).toFixed(1) + "s";
    return (Math.round(v * 10) / 10) + "ms";
  }

  function renderGantt(sp){
    if (!sp || !sp.count){ ganttEl.style.display = "none"; return; }
    ganttEl.style.display = "";

    var rows = [];
    (function walk(nodes){
      (nodes || []).forEach(function(n){
        rows.push(n);
        walk(n.children || []);
      });
    })(sp.tree || []);

    var total = sp.total_ms || 0;
    var base = rows.length ? rows[0].t0 : 0;     // 根节点起点 = 时间轴原点
    var span = (total || 1) / 1000;              // 总时长（秒）

    var top = (sp.bottlenecks || [])[0];
    var html = '<div class="gt-head"><b>耗时归因</b>' +
      '<span class="gt-total">本次 ' + fmtMs(total) + '</span>' +
      (top ? '<span class="gt-mut">瓶颈 ' + esc(top.name) + ' 自身 ' +
             fmtMs(top.self_ms) + '（' + (top.self_pct || 0) + '%）</span>' : "") +
      '<span class="gt-mut">' + (sp.count || 0) + ' 个 span</span></div>';

    rows.forEach(function(n){
      var left = total ? Math.max(0, Math.min(100, (n.t0 - base) / span * 100)) : 0;
      var w = total ? Math.max(0.7, Math.min(100 - left,
                                            n.duration_ms / total * 100)) : 0;
      var bad = n.status && n.status !== "ok";
      var cls = "gt-row" + (n.kind === "tool" ? " k-tool" : "") + (bad ? " bad" : "");
      html += '<div class="' + cls + '" title="' +
        esc(n.name + " · " + fmtMs(n.duration_ms) + " · " + (n.status || "") +
            (n.error ? " · " + n.error : "")) + '">' +
        '<div class="gt-name" style="padding-left:' + (n.depth || 0) * 12 + 'px">' +
          esc(n.name) + '</div>' +
        '<div class="gt-track"><div class="gt-bar" style="left:' +
          left.toFixed(2) + '%;width:' + w.toFixed(2) + '%"></div></div>' +
        '<div class="gt-ms">' + fmtMs(n.duration_ms) +
          ' <span style="opacity:.65">' + (n.pct || 0) + '%</span></div>' +
        '</div>';
    });

    if (sp.errors && sp.errors.length){
      html += '<div class="gt-err"><span class="lbl">错误节点：</span>' +
        sp.errors.map(function(e){
          return esc(e.path || e.name) + "（" + esc(e.status || "") +
                 (e.error ? " · " + esc(e.error) : "") + "）";
        }).join("<br>") + "</div>";
    }
    ganttEl.innerHTML = html;
  }

  function parseFrame(frame){
    var type = "message", dataLines = [];
    frame.split("\n").forEach(function(line){
      if (!line || line.charAt(0) === ":") return;
      var idx = line.indexOf(":");
      var field = idx < 0 ? line : line.slice(0, idx);
      var val = idx < 0 ? "" : line.slice(idx + 1);
      if (val.charAt(0) === " ") val = val.slice(1);
      if (field === "event") type = val;
      else if (field === "data") dataLines.push(val);
    });
    if (!dataLines.length) return null;
    var data;
    try { data = JSON.parse(dataLines.join("\n")); }
    catch (e) { data = {raw: dataLines.join("\n")}; }
    return {type: type, data: data};
  }

  function readSSE(res, onEvent){
    var reader = res.body.getReader();
    var dec = new TextDecoder();
    var buf = "";
    function pump(){
      return reader.read().then(function(r){
        if (r.done) return;
        buf += dec.decode(r.value, {stream: true});
        var i;
        while ((i = buf.indexOf("\n\n")) >= 0){
          var ev = parseFrame(buf.slice(0, i));
          buf = buf.slice(i + 2);
          if (ev) onEvent(ev);
        }
        return pump();
      });
    }
    return pump();
  }

  function runAgent(query){
    query = (query || "").trim();
    if (!query) return;
    ta.value = "";
    ta.style.height = "auto";
    sendBtn.disabled = true;
    if (agentCtrl) agentCtrl.abort();
    agentCtrl = new AbortController();

    var collected = [];
    traceSum.style.display = "none";
    ganttEl.style.display = "none";
    timeline.innerHTML = '<div class="tl-empty"><span class="dots">执行中</span></div>';

    fetch(AGENT + "/chat/stream", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: query}),
      signal: agentCtrl.signal
    }).then(function(res){
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status +
        "（Agent 服务未启动？见 tools/serve_ui.py 的提示）");
      return readSSE(res, function(ev){
        if (ev.type === "summary"){ renderSum(ev.data); return; }
        // span 树是单独一帧：不进时间线（它是树，不是事件），
        // 单独渲染成甘特条 —— 这就是"快速定位错误节点"那一栏
        if (ev.type === "spans"){ renderGantt(ev.data); return; }
        collected.push({type: ev.type, data: ev.data, ts: (ev.data || {}).ts});
        renderTimeline(collected);          // 每来一条就重绘 —— 这才是"实时"
      });
    }).then(function(){
      loadThreads();
    }).catch(function(e){
      if (e && e.name === "AbortError") return;
      timeline.innerHTML = '<div class="tl-empty">执行失败：' +
        esc(e && e.message ? e.message : String(e)) + '</div>';
    }).finally(function(){ sendBtn.disabled = false; });
  }

  function replay(tid){
    fetch(AGENT + "/trace/" + encodeURIComponent(tid))
      .then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(d){
        renderTimeline(d.events || []);
        renderSum(d.summary);
        renderGantt(d.spans);          // 回放同样能画出甘特条
      })
      .catch(function(e){
        timeline.innerHTML = '<div class="tl-empty">回放失败：' +
          esc(e && e.message ? e.message : String(e)) + '</div>';
      });
  }

  function loadThreads(){
    fetch(AGENT + "/threads?limit=30")
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d) return;
        var html = '<option value="">回放历史 thread…</option>';
        (d.threads || []).forEach(function(t){
          // 没有轨迹的检查点（本面板上线之前跑的）不列 —— 选了也是空白时间线
          if (!t.has_events) return;
          html += '<option value="' + esc(t.thread_id) + '">' +
            esc(t.thread_id) + " · " + (t.event_count || 0) + " 事件 · " +
            esc((t.query || "").slice(0, 16)) + "</option>";
        });
        threadSel.innerHTML = html;
      })
      .catch(function(){});
  }

  threadSel.onchange = function(){ if (threadSel.value) replay(threadSel.value); };
  onlyErr.onchange = function(){ timeline.classList.toggle("only-err", onlyErr.checked); };

  /* ---------------- 视图切换 ---------------- */
  var tabChat = document.getElementById("tabChat");
  var tabTrace = document.getElementById("tabTrace");
  var traceWrap = document.getElementById("traceWrap");
  var optRetrieve = document.querySelector(".opts label");
  function setMode(m){
    mode = m;
    tabChat.classList.toggle("on", m === "chat");
    tabTrace.classList.toggle("on", m === "trace");
    wrap.style.display = m === "chat" ? "" : "none";
    traceWrap.style.display = m === "trace" ? "" : "none";
    if (optRetrieve) optRetrieve.style.display = m === "chat" ? "" : "none";
    hint.textContent = m === "chat" ? "SSE token 级流式" : "SSE 节点级轨迹";
    ta.placeholder = m === "chat"
      ? "输入问题，Enter 发送，Shift+Enter 换行"
      : "输入任务，观察 Agent 的 plan / 工具调用 / 校验轨迹";
    scrollBottom();
  }
  tabChat.onclick = function(){ setMode("chat"); };
  tabTrace.onclick = function(){ setMode("trace"); };

  /* ---------------- 输入交互 ---------------- */
  ta.addEventListener("input", function(){
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 160) + "px";
  });
  ta.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      if (mode === "trace") runAgent(ta.value); else ask(ta.value);
    }
  });
  sendBtn.onclick = function(){
    if (mode === "trace") runAgent(ta.value); else ask(ta.value);
  };

  health();
  loadThreads();
  boot();          // 恢复上次会话（刷新不丢对话）
  ta.focus();
})();
</script>
</body>
</html>
